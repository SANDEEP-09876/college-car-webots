          }
          # front bumper @ (138, 0)
          Transform {
            translation 0.138 -0.0525 0
            children [ Shape {
              appearance PBRAppearance { baseColor 0.80 0.20 0.10 roughness 0.6 }
              geometry Box { size 0.02 0.026 0.17 } } ]
          }
        ]
        boundingObject Box { size 0.26 0.075 0.18 }
        physics Physics {
          mass 1.85   # 1.7 car + 0.15 arm base + PDB
        }
      }

      # ---------------- wheels: 4x HingeJoint, axle along Z ----------------
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.0675 0.04 0.1
        }
        device [
          RotationalMotor {
            name "wheel_fl"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_fl"
          }
        ]
        endPoint Solid {
          translation 0.0675 0.04 0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.0675 0.04 -0.1
        }
        device [
          RotationalMotor {
            name "wheel_fr"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_fr"
          }
        ]
        endPoint Solid {
          translation 0.0675 0.04 -0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor -0.0675 0.04 0.1
        }
        device [
          RotationalMotor {
            name "wheel_rl"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_rl"
          }
        ]
        endPoint Solid {
          translation -0.0675 0.04 0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
