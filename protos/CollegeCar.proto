      # ---------------- sensors (Webots: sense/look along +X) ----------------
      # front ToF @ (124, 0, 140)mm, faces +X
      DistanceSensor {
        translation 0.124 0.140 0
        name "tof_front"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # left ToF @ (98, 82, 140)mm, yaw +30deg toward front-left
      DistanceSensor {
        translation 0.098 0.140 0.082
        rotation 0 1 0 -0.5236
        name "tof_left"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # right ToF @ (98, -82, 140)mm, yaw -30deg toward front-right
      DistanceSensor {
        translation 0.098 0.140 -0.082
        rotation 0 1 0 0.5236
        name "tof_right"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # Pi Camera V2 @ low front mount (118, 0, 150)mm, pitched down 12deg,
      # 62.2deg HFOV. Moved from the mast (108, 0, 209): the mast stood in
      # the arm's sweep, so the camera now sits on the low front mount
      # (same mount as the photo-arm CAD package).
      Camera {
        translation 0.118 0.150 0
        rotation 0 0 1 -0.2094
        name "camera"
        width 640
        height 480
        fieldOfView 1.0857
        near 0.05
      }
      # MPU6050 equivalent
      InertialUnit {
        name "imu"
      }
      # ground-truth position (stand-in for the odometry stack under test)
      GPS {
        name "gps"
      }
    ]
  }
}
