#VRML_SIM R2023b utf8
# CollegeCar - 4WD autonomous car matching the final CAD (260x180 plates,
# 65mm wheels, wheelbase 135mm, track 200mm, 3x ToF, Pi Camera V2, MPU6050).
# Webots axes: X forward, Y up, Z left  (CAD: X fwd, Y left, Z up).

PROTO CollegeCar [
  field SFVec3f    translation  0 0 0
  field SFRotation   rotation     0 1 0 0
  field SFString     controller   "college_car"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller IS controller
    children [

      # ---------------- chassis: one rigid physics body ----------------
      DEF BODY Solid {
        translation 0 0.0925 0
        children [
          # lower plate 260x180x4 @ y=57
          Transform {
            translation 0 -0.0355 0
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.16 0.16 0.18 roughness 0.7 metalness 0.1 }
                geometry Box { size 0.26 0.004 0.18 }
              }
            ]
          }
          # upper deck 260x180x4 @ y=127
          Transform {
            translation 0 0.0345 0
            children [
              Shape {
                appearance PBRAppearance { baseColor 0.20 0.20 0.23 roughness 0.7 metalness 0.1 }
                geometry Box { size 0.26 0.004 0.18 }
              }
            ]
          }
          # 4 pillars @ (±110, ±70)
          Transform {
            translation 0.11 -0.0005 0.07
            children [ Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.60 roughness 0.5 metalness 0.4 }
              geometry Box { size 0.02 0.066 0.02 } } ]
          }
          Transform {
            translation 0.11 -0.0005 -0.07
            children [ Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.60 roughness 0.5 metalness 0.4 }
              geometry Box { size 0.02 0.066 0.02 } } ]
          }
          Transform {
            translation -0.11 -0.0005 0.07
            children [ Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.60 roughness 0.5 metalness 0.4 }
              geometry Box { size 0.02 0.066 0.02 } } ]
          }
          Transform {
            translation -0.11 -0.0005 -0.07
            children [ Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.60 roughness 0.5 metalness 0.4 }
              geometry Box { size 0.02 0.066 0.02 } } ]
          }
          # battery box 75x56x40 @ (-60, 0)
          Transform {
            translation -0.06 -0.0195 0
            children [ Shape {
              appearance PBRAppearance { baseColor 0.10 0.45 0.15 roughness 0.6 }
              geometry Box { size 0.075 0.04 0.056 } } ]
          }
          # SmartElex 15D x2 @ (45, ±47.5)
          Transform {
            translation 0.045 -0.0245 0.0475
            children [ Shape {
              appearance PBRAppearance { baseColor 0.10 0.25 0.70 roughness 0.6 }
              geometry Box { size 0.07 0.018 0.055 } } ]
          }
          Transform {
            translation 0.045 -0.0245 -0.0475
            children [ Shape {
              appearance PBRAppearance { baseColor 0.10 0.25 0.70 roughness 0.6 }
              geometry Box { size 0.07 0.018 0.055 } } ]
          }
          # switch/fuse/XT60 block @ (110, -25)
          Transform {
            translation 0.11 -0.0245 -0.025
            children [ Shape {
              appearance PBRAppearance { baseColor 0.75 0.15 0.10 roughness 0.6 }
              geometry Box { size 0.03 0.02 0.05 } } ]
          }
          # Pi 5 @ (-60, 35)
          Transform {
            translation -0.06 0.045 0.035
            children [ Shape {
              appearance PBRAppearance { baseColor 0.05 0.40 0.10 roughness 0.6 }
              geometry Box { size 0.085 0.017 0.056 } } ]
          }
          # ESP32 @ (-60, -45)
          Transform {
            translation -0.06 0.0425 -0.045
            children [ Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.10 roughness 0.6 }
              geometry Box { size 0.052 0.01 0.028 } } ]
          }
          # XL4015 @ (10, -62)
          Transform {
            translation 0.01 0.0435 -0.062
            children [ Shape {
              appearance PBRAppearance { baseColor 0.30 0.30 0.35 roughness 0.5 metalness 0.5 }
              geometry Box { size 0.048 0.012 0.024 } } ]
          }
          # LM2596 @ (75, -65)
          Transform {
            translation 0.075 0.0425 -0.065
            children [ Shape {
              appearance PBRAppearance { baseColor 0.30 0.30 0.35 roughness 0.5 metalness 0.5 }
              geometry Box { size 0.043 0.012 0.021 } } ]
          }
          # MPU6050 @ (0, 65)
          Transform {
            translation 0 0.049 0.065
            children [ Shape {
              appearance PBRAppearance { baseColor 0.60 0.10 0.60 roughness 0.6 }
              geometry Box { size 0.02 0.005 0.016 } } ]
          }
          # camera mast 12x12x76 @ (108, 0)
          Transform {
            translation 0.108 0.0745 0
            children [ Shape {
              appearance PBRAppearance { baseColor 0.35 0.35 0.38 roughness 0.5 metalness 0.4 }
              geometry Box { size 0.012 0.076 0.012 } } ]
          }
          # camera housing visual @ (108, 0, 209)
          Transform {
            translation 0.108 0.1165 0
            children [ Shape {
              appearance PBRAppearance { baseColor 0.05 0.05 0.06 roughness 0.4 }
              geometry Box { size 0.025 0.02 0.024 } } ]
          }
          # front bumper @ (138, 0)
          Transform {
            translation 0.138 -0.0525 0
            children [ Shape {
              appearance PBRAppearance { baseColor 0.80 0.20 0.10 roughness 0.6 }
              geometry Box { size 0.02 0.026 0.17 } } ]
          }
        ]
        boundingObject Box { size 0.26 0.075 0.18 }
        physics Physics {
          mass 1.7
        }
      }

      # ---------------- wheels: 4x HingeJoint, axle along Z ----------------
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.0675 0.04 0.1
        }
        device [
          RotationalMotor {
            name "wheel_fl"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_fl"
          }
        ]
        endPoint Solid {
          translation 0.0675 0.04 0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.0675 0.04 -0.1
        }
        device [
          RotationalMotor {
            name "wheel_fr"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_fr"
          }
        ]
        endPoint Solid {
          translation 0.0675 0.04 -0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor -0.0675 0.04 0.1
        }
        device [
          RotationalMotor {
            name "wheel_rl"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_rl"
          }
        ]
        endPoint Solid {
          translation -0.0675 0.04 0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor -0.0675 0.04 -0.1
        }
        device [
          RotationalMotor {
            name "wheel_rr"
            maxVelocity 7.33
            maxTorque 0.25
          }
          PositionSensor {
            name "enc_rr"
          }
        ]
        endPoint Solid {
          translation -0.0675 0.04 -0.1
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.08 0.08 0.09 roughness 0.9 }
              geometry Cylinder { radius 0.0325 height 0.026 }
            }
            Shape {
              appearance PBRAppearance { baseColor 0.55 0.55 0.58 roughness 0.4 metalness 0.6 }
              geometry Cylinder { radius 0.012 height 0.028 }
            }
          ]
          boundingObject Cylinder { radius 0.0325 height 0.026 }
          physics Physics {
            density -1
            mass 0.06
          }
        }
      }

      # ---------------- sensors (Webots: sense/look along +X) ----------------
      # front ToF @ (124, 0, 140)mm, faces +X
      DistanceSensor {
        translation 0.124 0.140 0
        name "tof_front"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # left ToF @ (98, 82, 140)mm, yaw +30deg toward front-left
      DistanceSensor {
        translation 0.098 0.140 0.082
        rotation 0 1 0 -0.5236
        name "tof_left"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # right ToF @ (98, -82, 140)mm, yaw -30deg toward front-right
      DistanceSensor {
        translation 0.098 0.140 -0.082
        rotation 0 1 0 0.5236
        name "tof_right"
        type "generic"
        numberOfRays 1
        lookupTable [ 0 0 0, 0.02 1000 0, 2.0 0 0 ]
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.55 0.10 0.10 roughness 0.6 }
            geometry Box { size 0.016 0.01 0.013 }
          }
        ]
      }
      # Pi Camera V2 @ (108, 0, 209)mm, pitched down 12deg, 62.2deg HFOV
      Camera {
        translation 0.108 0.209 0
        rotation 0 0 1 -0.2094
        name "camera"
        width 640
        height 480
        fieldOfView 1.0857
        near 0.05
      }
      # MPU6050 equivalent
      InertialUnit {
        name "imu"
      }
      # ground-truth position (stand-in for the odometry stack under test)
      GPS {
        name "gps"
      }
    ]
  }
}
